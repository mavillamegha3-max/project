<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CGPA Calculator</title>

<link rel="stylesheet" href="style.css">

<style>

.container{
    width:90%;
    max-width:850px;
    margin:40px auto;
    background:white;
    color:black;
    border-radius:15px;
    padding:25px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:10px;
    text-align:center;
}

input{
    width:100%;
    padding:8px;
}

button{
    padding:10px 20px;
    margin:10px;
    border:none;
    background:#3B82F6;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#2563EB;
}

#result{
    font-size:25px;
    font-weight:bold;
    margin-top:20px;
}

</style>

</head>

<body>

<nav>

<div class="logo">
🎓 Student Academic Calculator
</div>

<ul>

<li><a href="index.html">Home</a></li>
<li><a href="gpa.html">GPA</a></li>
<li><a href="cgpa.html">CGPA</a></li>
<li><a href="target.html">Target CGPA</a></li>
<li><a href="credits.html">Course Credits</a></li>
<li><a href="about.html">About</a></li>
<li><a href="help.html">Help</a></li>

</ul>

</nav>

<div class="container">

<h2 align="center">
Overall CGPA Calculator
</h2>

<table id="table">

<tr>

<th>Semester</th>

<th>Semester GPA</th>

<th>Total Credits</th>

<th>Remove</th>

</tr>

</table>

<center>

<button onclick="addSemester()">

Add Semester

</button>

<button onclick="calculateCGPA()">

Calculate CGPA

</button>

<button onclick="resetAll()">

Reset

</button>

</center>

<div id="result" align="center"></div>

</div>

<script>

let semesterNumber = 1;

function addSemester(){

let table=document.getElementById("table");

let row=table.insertRow();

row.innerHTML=`

<td>

Semester ${semesterNumber++}

</td>

<td>

<input type="number"

step="0.01"

placeholder="Enter GPA">

</td>

<td>

<input type="number"

placeholder="Credits">

</td>

<td>

<button onclick="removeRow(this)">X</button>

</td>

`;

}

function removeRow(btn){

btn.parentNode.parentNode.remove();

}

function calculateCGPA(){

let table=document.getElementById("table");

let totalCredits=0;

let weightedSum=0;

for(let i=1;i<table.rows.length;i++){

let row=table.rows[i];

let gpa=parseFloat(row.cells[1].children[0].value);

let credit=parseFloat(row.cells[2].children[0].value);

if(!isNaN(gpa) && !isNaN(credit)){

weightedSum += gpa*credit;

totalCredits += credit;

}

}

if(totalCredits==0){

document.getElementById("result").innerHTML="Please enter valid data.";

return;

}

let cgpa=(weightedSum/totalCredits).toFixed(2);

document.getElementById("result").innerHTML=

"Overall CGPA : "+cgpa;

}

function resetAll(){

document.getElementById("table").innerHTML=

`<tr>
<th>Semester</th>
<th>Semester GPA</th>
<th>Total Credits</th>
<th>Remove</th>
</tr>`;

semesterNumber=1;

addSemester();

document.getElementById("result").innerHTML="";

}

addSemester();

</script>

</body>

</html>
